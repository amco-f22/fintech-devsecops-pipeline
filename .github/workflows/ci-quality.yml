# ==============================================================================
# CI Quality Gates — Shift-Left Quality Pipeline
# ==============================================================================
# Runs BEFORE security scanning. If quality fails, pipeline stops early.
# Gates: API tests, OPA policy tests, Terraform validation, Helm linting
# ==============================================================================

name: CI Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────
  # Job 1: FastAPI Service Tests
  # ──────────────────────────────────────────
  api-tests:
    name: "🧪 API Tests (Pytest)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r services/webhook-service/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        working-directory: services/webhook-service
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/webhook-service/coverage.xml

      - name: Post coverage to job summary
        if: always()
        working-directory: services/webhook-service
        run: |
          echo "## 🧪 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest tests/ -v --cov=. --cov-report=term 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Job 2: OPA Policy Tests
  # ──────────────────────────────────────────
  policy-tests:
    name: "📋 OPA Policy Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Run policy tests
        run: |
          echo "## 📋 OPA Policy Test Results" >> $GITHUB_STEP_SUMMARY
          opa test policies/ -v 2>&1 | tee /tmp/opa-results.txt
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/opa-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Job 3: Terraform Validation
  # ──────────────────────────────────────────
  terraform-validate:
    name: "🏗️ Terraform Validate"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module:
          - terraform/modules/vpc
          - terraform/modules/eks
          - terraform/modules/ecr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ matrix.module }}
        run: terraform validate

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

      - name: Run TFLint
        working-directory: ${{ matrix.module }}
        run: tflint --init && tflint

  # ──────────────────────────────────────────
  # Job 4: Helm Chart Linting
  # ──────────────────────────────────────────
  helm-lint:
    name: "⎈ Helm Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: "v3.15.0"

      - name: Lint Helm chart
        run: helm lint helm/webhook-service/

      - name: Template render test
        run: |
          helm template test-release helm/webhook-service/ > /dev/null
          echo "✅ Helm template renders successfully" >> $GITHUB_STEP_SUMMARY
