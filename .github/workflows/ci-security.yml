# ==============================================================================
# CI Security Gates — DevSecOps Pipeline
# ==============================================================================
# Security scanning stages:
# - Gitleaks: Secret scanning
# - Trivy: Container + dependency vulnerability scanning
# - Checkov: IaC misconfiguration scanning
# - OPA: Policy-as-code admission gate
# - cosign + SLSA: Supply chain integrity (container signing + provenance)
# ==============================================================================

name: CI Security Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  id-token: write  # Required for SLSA provenance
  packages: write  # Required for pushing to GHCR

jobs:
  # ──────────────────────────────────────────
  # Job 1: Secret Scanning
  # ──────────────────────────────────────────
  secret-scan:
    name: "🔐 Gitleaks Secret Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post results
        if: always()
        run: |
          echo "## 🔐 Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ No secrets detected in codebase" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Job 2: Container Vulnerability Scanning
  # ──────────────────────────────────────────
  container-scan:
    name: "🛡️ Trivy Container Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t webhook-service:scan \
            services/webhook-service/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "webhook-service:scan"
          format: "table"
          exit-code: "1"  # Fail on HIGH/CRITICAL
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "services/webhook-service/"
          format: "table"
          severity: "HIGH,CRITICAL"

  # ──────────────────────────────────────────
  # Job 3: IaC Security Scanning
  # ──────────────────────────────────────────
  iac-scan:
    name: "🔍 IaC Security Scan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli


  # ──────────────────────────────────────────
  # Job 4: OPA Policy Gate
  # ──────────────────────────────────────────
  policy-gate:
    name: "📋 OPA Admission Gate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Evaluate Helm chart against policies
        run: |
          # Render Helm templates to K8s manifests
          helm template webhook-release helm/webhook-service/ > /tmp/rendered.yaml

          # Split multi-doc YAML and evaluate each against policies
          echo "Evaluating rendered manifests against OPA policies..."

          # Evaluate container security
          opa eval --data policies/container_security.rego \
            --input /tmp/rendered.yaml \
            "data.container_security.deny" --format pretty

          # Evaluate network security
          opa eval --data policies/network_security.rego \
            --input /tmp/rendered.yaml \
            "data.network_security.deny" --format pretty

          # Evaluate PCI compliance
          opa eval --data policies/pci_compliance.rego \
            --input /tmp/rendered.yaml \
            "data.pci_compliance.deny" --format pretty

      - name: Post policy results
        if: always()
        run: |
          echo "## 📋 OPA Policy Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "Policies evaluated: container_security, network_security, pci_compliance" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Job 5: Container Signing + SLSA Provenance
  # ──────────────────────────────────────────
  sign-and-attest:
    name: "✍️ cosign + SLSA L3"
    runs-on: ubuntu-latest
    needs: [secret-scan, container-scan, iac-scan, policy-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image
        id: build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/$OWNER/webhook-service:${{ github.sha }}"
          docker build -t $IMAGE_TAG services/webhook-service/
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Push image
        run: docker push ${{ steps.build.outputs.image }}

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes ${{ steps.build.outputs.image }}

      - name: Generate SLSA L3 provenance
        run: |
          cosign attest --yes --predicate <(
            cat <<EOF
          {
            "buildType": "https://github.com/slsa-framework/slsa/blob/main/docs/provenance/v1",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": {"sha1": "${{ github.sha }}"},
                "entryPoint": ".github/workflows/ci-security.yml"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}",
              "buildStartedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "completeness": {
                "parameters": true,
                "environment": true,
                "materials": true
              }
            }
          }
          EOF
          ) ${{ steps.build.outputs.image }}

      - name: Post signing results
        if: always()
        run: |
          echo "## ✍️ Supply Chain Security" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container image signed with cosign (keyless/Sigstore)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SLSA Level 3 provenance attested" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ steps.build.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
