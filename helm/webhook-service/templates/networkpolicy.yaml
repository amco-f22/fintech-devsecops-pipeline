{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webhook-service.fullname" . }}
  labels:
    {{- include "webhook-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webhook-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller and monitoring
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ $.Values.service.targetPort }}
          protocol: TCP
    {{- end }}
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS outbound (AWS APIs, external services)
    - to: []
      ports:
        - port: 443
          protocol: TCP
{{- end }}
